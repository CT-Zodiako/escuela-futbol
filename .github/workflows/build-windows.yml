name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure bundle version and updater artifacts
        shell: pwsh
        env:
          RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $path = 'apps/desktop/src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json
          if ($env:RELEASE_BUILD -eq 'true') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw 'Release tags must use stable vMAJOR.MINOR.PATCH versions.'
            }
            $config.version = $Matches[1]
            if ([version]$config.version -le [version]'0.1.2') {
              throw 'Updater releases must be newer than the 0.1.2 base installer.'
            }
            # Tauri v2 normally signs the EXE directly. Compatibility mode also
            # emits the requested signed .nsis.zip, accepted by the v2 updater.
            $config.bundle.createUpdaterArtifacts = 'v1Compatible'
          } else {
            # Manual/push test builds must not require the production signing key.
            $config.bundle.createUpdaterArtifacts = $false
          }
          $config | ConvertTo-Json -Depth 30 | Set-Content $path -Encoding utf8

      - name: Build Windows x64 NSIS test installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm --filter @escuela-futbol/desktop build --target x86_64-pc-windows-msvc --bundles nsis
        env:
          VITE_APP_VERSION: 0.0.0-dev

      - name: Build signed Windows x64 NSIS release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY secret is required for releases.'
          }
          pnpm --filter @escuela-futbol/desktop build --target x86_64-pc-windows-msvc --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: escuela-futbol-windows-x64-nsis
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Generate updater metadata and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem "$bundle/*.exe")
          $archives = @(Get-ChildItem "$bundle/*.nsis.zip")
          if ($installers.Count -ne 1 -or $archives.Count -ne 1) {
            throw 'Expected exactly one NSIS installer and one updater archive.'
          }
          $archive = $archives[0]
          $signaturePath = "$($archive.FullName).sig"
          $signature = (Get-Content $signaturePath -Raw -ErrorAction Stop).Trim()
          if (!$signature) { throw 'Updater signature is empty.' }
          $tag = $env:GITHUB_REF_NAME
          # GitHub release asset URLs normalize spaces to dots; use the published name in metadata.
          $publishedArchiveName = $archive.Name.Replace(' ', '.')
          $assetName = [uri]::EscapeDataString($publishedArchiveName)
          $metadata = @{
            version = $tag.Substring(1)
            notes = "Escuela Futbol $tag"
            pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = $signature
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$assetName"
              }
            }
          }
          $metadata | ConvertTo-Json -Depth 10 | Set-Content "$bundle/latest.json" -Encoding utf8
          # Keep incomplete releases out of the latest endpoint until all assets exist.
          gh release create $tag --verify-tag --draft --title "Escuela Futbol $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = @($installers[0].FullName, $archive.FullName, $signaturePath, "$bundle/latest.json")
          gh release upload $tag @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit latest.json to release branch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $branch = 'release/v0.3.0-local-only'
          $source = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/latest.json'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin $branch
          git checkout $branch
          Copy-Item $source 'latest.json' -Force
          git add latest.json
          git commit -m "chore(updater): update latest.json for $tag" --allow-empty
          git push origin $branch
