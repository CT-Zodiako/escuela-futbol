[package]
name = "escuela-futbol-desktop"
version = "0.1.0"
description = "Desktop shell for Escuela Futbol"
authors = ["Escuela Futbol"]
edition = "2021"

[lib]
name = "escuela_futbol_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
